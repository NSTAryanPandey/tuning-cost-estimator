# Render blueprint for the FastAPI backend (free plan).
services:
  - type: web
    name: tuning-estimator-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET
        generateValue: true        # Render creates a long random secret for you
      - key: ALLOWED_ORIGINS
        sync: false                # your Vercel URL, set after the frontend is deployed
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
